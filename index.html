<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民謡カセット</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
    background: #fff;
    color: #2a1a10;
    min-height: 100svh;
    padding: 32px 16px 64px;
    font-size: 18px;
  }

  /* ---- ヘッダー ---- */
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-size: clamp(2rem, 6vw, 2.8rem);
    font-weight: 700;
    color: #2a1a10;
    letter-spacing: 0.2em;
  }
  header p {
    margin-top: 8px;
    font-size: 1rem;
    color: #a08060;
    letter-spacing: 0.15em;
  }

  /* ---- カセットグリッド ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 32px 24px;
    max-width: 900px;
    margin: 0 auto 40px;
  }

  /* ---- カセットカード ---- */
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .cassette-body {
    width: 180px;
    height: 110px;
    background: linear-gradient(160deg, #3a2718 0%, #2a1a10 100%);
    border-radius: 9px;
    border: 1.5px solid #6a4a32;
    position: relative;
    box-shadow: 0 4px 16px rgba(80,40,10,0.15);
    flex-shrink: 0;
  }

  /* ラベル */
  .cassette-label {
    position: absolute;
    top: 8px; left: 11px; right: 11px;
    height: 44px;
    background: linear-gradient(135deg, #f5e8c0 0%, #e0cc88 100%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 4px 8px;
  }
  .cassette-label::before,
  .cassette-label::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: repeating-linear-gradient(
      90deg, #b89a50 0, #b89a50 4px, transparent 4px, transparent 8px
    );
  }
  .cassette-label::before { top: 0; }
  .cassette-label::after  { bottom: 0; }

  .label-text {
    font-size: 0.8rem;
    font-weight: 700;
    color: #2a1a10;
    text-align: center;
    line-height: 1.3;
    max-width: 100%;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  /* リール部 */
  .reel-area {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    gap: 0;
  }

  .reel {
    width: 36px; height: 36px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #888 0%, #555 18%, transparent 18%),
      conic-gradient(#4a4a4a 0deg,#666 60deg,#4a4a4a 120deg,#666 180deg,#4a4a4a 240deg,#666 300deg,#4a4a4a 360deg);
    border: 2px solid #777;
    flex-shrink: 0;
    position: relative;
  }
  .reel::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, transparent 26%, rgba(0,0,0,0.3) 26%);
  }
  .reel.spinning { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tape-window {
    flex: 1;
    max-width: 52px;
    height: 20px;
    background: #0e0a06;
    border: 1.5px solid #555;
    border-radius: 3px;
    position: relative;
    margin: 0 4px;
  }
  .tape-window::after {
    content: '';
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 2px;
    background: #7a4a20;
    transform: translateY(-50%);
  }

  /* 切り欠き */
  .notch {
    position: absolute;
    bottom: 0;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 0 7px 0 0;
  }
  .notch.left  { left: 0; }
  .notch.right { right: 0; border-radius: 7px 0 0 0; }

  /* カードのタイトルと再生ボタン */
  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #2a1a10;
    text-align: center;
    max-width: 180px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .play-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2.5px solid #c8853a;
    background: transparent;
    color: #c8853a;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }
  .play-btn:hover { background: #c8853a; color: #fff; }
  .play-btn.active { background: #c8853a; color: #fff; }

  .del-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid #ddd;
    background: transparent;
    color: #bbb;
    font-size: 0.75rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, color 0.2s;
    font-family: inherit;
  }
  .del-btn:hover { border-color: #e06050; color: #e06050; }

  /* ---- 追加ボタン ---- */
  .add-wrap {
    max-width: 900px;
    margin: 0 auto 32px;
    text-align: center;
  }

  .add-toggle-btn {
    padding: 14px 36px;
    border: 2px dashed #c8a870;
    border-radius: 50px;
    background: transparent;
    color: #a07840;
    font-size: 1.1rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.05em;
  }
  .add-toggle-btn:hover { background: #fdf5e8; color: #7a5820; }

  /* ---- 追加フォーム ---- */
  .add-form {
    max-width: 480px;
    margin: 16px auto 0;
    background: #fdf8f0;
    border: 1px solid #e8d5b0;
    border-radius: 12px;
    padding: 20px;
    display: none;
  }
  .add-form.open { display: block; }

  .add-form label {
    display: block;
    font-size: 1rem;
    color: #8a6040;
    margin-bottom: 5px;
    margin-top: 12px;
    font-weight: 700;
  }
  .add-form label:first-of-type { margin-top: 0; }

  .add-form input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0c898;
    border-radius: 6px;
    background: #fff;
    color: #2a1a10;
    font-size: 1rem;
    font-family: inherit;
  }
  .add-form input[type="text"]:focus {
    outline: none;
    border-color: #c8853a;
  }

  .form-btns {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-primary {
    padding: 12px 28px;
    background: #c8853a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }

  .btn-cancel {
    padding: 12px 20px;
    background: transparent;
    color: #a08060;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1.05rem;
    font-family: inherit;
    cursor: pointer;
  }

  .form-error {
    font-size: 1rem;
    color: #c04040;
    margin-top: 8px;
    min-height: 1.2em;
  }

  /* ---- プレイヤー ---- */
  .player-section {
    max-width: 720px;
    margin: 0 auto;
    display: none;
  }
  .player-section.visible { display: block; }

  .player-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .player-header h2 {
    font-size: 1.2rem;
    font-weight: 700;
    color: #2a1a10;
    flex: 1;
  }
  .close-btn {
    padding: 8px 20px;
    border: 1px solid #ddd;
    background: transparent;
    color: #a08060;
    border-radius: 20px;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
  }

  .player-section iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 10px;
    display: block;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  /* 空メッセージ */
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: #b0906a;
    font-size: 1.05rem;
    padding: 32px 0;
  }
</style>
</head>
<body>

<header>
  <h1>民謡カセット</h1>
  <p>JAPANESE FOLK SONGS</p>
</header>

<div class="grid" id="cassette-grid"></div>

<div class="add-wrap">
  <button class="add-toggle-btn" onclick="toggleForm()">＋ カセットを追加する</button>
  <div class="add-form" id="add-form">
    <label for="new-title">タイトル</label>
    <input type="text" id="new-title" placeholder="例：津軽じょんがら節">
    <label for="new-url">YouTube URL</label>
    <input type="text" id="new-url" placeholder="https://youtu.be/XXXXX または playlist?list=XXXXX">
    <div class="form-error" id="form-error"></div>
    <div class="form-btns">
      <button class="btn-primary" onclick="addCassette()">追加する</button>
      <button class="btn-cancel" onclick="toggleForm()">キャンセル</button>
    </div>
  </div>
</div>

<div class="player-section" id="player-section">
  <div class="player-header">
    <h2 id="player-title"></h2>
    <button class="close-btn" onclick="stopPlay()">閉じる</button>
  </div>
  <iframe id="yt-frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

<script>
  const STORAGE_KEY = 'minyou_cassettes_v2';

  function load() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || [
      { id: 1, title: '民謡', url: 'https://youtu.be/E_Fhr2FRjHM?si=V8TXJbjHAjqmdjxi' }
    ];
  }

  function save(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function embedSrc(raw) {
    const listM = raw.match(/[?&]list=([^&\s]+)/);
    if (listM) return 'https://www.youtube.com/embed/videoseries?list=' + listM[1] + '&autoplay=1';
    const shortM = raw.match(/youtu\.be\/([^?&\s]+)/);
    if (shortM) return 'https://www.youtube.com/embed/' + shortM[1] + '?autoplay=1';
    const watchM = raw.match(/[?&]v=([^&\s]+)/);
    if (watchM) return 'https://www.youtube.com/embed/' + watchM[1] + '?autoplay=1';
    return null;
  }

  let currentId = null;

  function render() {
    const list = load();
    const grid = document.getElementById('cassette-grid');
    grid.innerHTML = '';

    if (list.length === 0) {
      grid.innerHTML = '<div class="empty-msg">カセットがまだありません。下の「追加する」から登録してください。</div>';
      return;
    }

    list.forEach(item => {
      const isActive = item.id === currentId;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="cassette-body">
          <div class="cassette-label">
            <div class="label-text">${esc(item.title)}</div>
          </div>
          <div class="reel-area">
            <div class="reel${isActive ? ' spinning' : ''}" id="reel-l-${item.id}"></div>
            <div class="tape-window"></div>
            <div class="reel${isActive ? ' spinning' : ''}" id="reel-r-${item.id}"></div>
          </div>
          <div class="notch left"></div>
          <div class="notch right"></div>
        </div>
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-actions">
          <button class="play-btn${isActive ? ' active' : ''}" onclick="togglePlay(${item.id})" title="再生 / 停止">
            ${isActive ? '&#9646;&#9646;' : '&#9654;'}
          </button>
          <button class="del-btn" onclick="deleteCassette(${item.id})" title="削除">✕</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function esc(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function togglePlay(id) {
    if (currentId === id) { stopPlay(); return; }

    const list = load();
    const item = list.find(c => c.id === id);
    if (!item) return;

    const src = embedSrc(item.url);
    if (!src) return;

    currentId = id;
    document.getElementById('yt-frame').src = src;
    document.getElementById('player-title').textContent = item.title;
    document.getElementById('player-section').classList.add('visible');
    document.getElementById('player-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    render();
  }

  function stopPlay() {
    currentId = null;
    document.getElementById('yt-frame').src = '';
    document.getElementById('player-section').classList.remove('visible');
    render();
  }

  function deleteCassette(id) {
    if (!confirm('このカセットを削除しますか？')) return;
    if (currentId === id) stopPlay();
    const list = load().filter(c => c.id !== id);
    save(list);
    render();
  }

  function toggleForm() {
    const form = document.getElementById('add-form');
    form.classList.toggle('open');
    document.getElementById('form-error').textContent = '';
    if (form.classList.contains('open')) {
      document.getElementById('new-title').focus();
    }
  }

  function addCassette() {
    const title = document.getElementById('new-title').value.trim();
    const url   = document.getElementById('new-url').value.trim();
    const errEl = document.getElementById('form-error');

    if (!title) { errEl.textContent = 'タイトルを入力してください'; return; }
    if (!url)   { errEl.textContent = 'URLを入力してください'; return; }
    if (!embedSrc(url)) { errEl.textContent = '有効なYouTube URLを入力してください'; return; }

    const list = load();
    const newId = Date.now();
    list.push({ id: newId, title, url });
    save(list);

    document.getElementById('new-title').value = '';
    document.getElementById('new-url').value = '';
    errEl.textContent = '';
    document.getElementById('add-form').classList.remove('open');
    render();
  }

  render();
</script>
</body>
</html>
