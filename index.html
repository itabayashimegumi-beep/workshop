<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民謡カセット</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #1a1228;
    color: #e0d8cc;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  /* ---- ヘッダー ---- */
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  header h1 {
    font-size: clamp(1.4rem, 5vw, 2rem);
    letter-spacing: 0.25em;
    color: #f0e0b8;
  }
  header p {
    margin-top: 6px;
    font-size: 0.8rem;
    color: #8a7a6a;
    letter-spacing: 0.15em;
  }

  /* ---- カセットテープ ---- */
  .cassette {
    width: min(340px, 92vw);
    height: 200px;
    background: linear-gradient(160deg, #3a2718 0%, #2a1a10 100%);
    border-radius: 14px;
    border: 2px solid #6a4a32;
    position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
    margin: 0 auto;
  }

  /* ラベル */
  .cassette-label {
    position: absolute;
    top: 14px;
    left: 22px;
    right: 22px;
    height: 76px;
    background: linear-gradient(135deg, #f0e4c4 0%, #d8c89a 100%);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .cassette-label::before,
  .cassette-label::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      #b89a60 0, #b89a60 5px,
      transparent 5px, transparent 10px
    );
  }
  .cassette-label::before { top: 0; }
  .cassette-label::after  { bottom: 0; }

  .label-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #2a1a10;
    letter-spacing: 0.2em;
  }
  .label-sub {
    font-size: 0.65rem;
    color: #7a5a30;
    letter-spacing: 0.18em;
    margin-top: 4px;
  }

  /* リール部 */
  .reel-area {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 0 20px;
  }

  .reel {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #888 0%, #555 18%, transparent 18%),
      conic-gradient(#4a4a4a 0deg, #666 60deg, #4a4a4a 120deg, #666 180deg, #4a4a4a 240deg, #666 300deg, #4a4a4a 360deg);
    border: 3px solid #777;
    flex-shrink: 0;
    position: relative;
  }
  .reel::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, transparent 26%, rgba(0,0,0,0.35) 26%);
  }

  .reel.spinning {
    animation: spin 1.6s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* テープ窓 */
  .tape-window {
    flex: 1;
    max-width: 88px;
    height: 34px;
    background: #0e0a06;
    border: 2px solid #555;
    border-radius: 5px;
    position: relative;
    margin: 0 6px;
    overflow: hidden;
  }
  .tape-line {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 3px;
    background: #7a4a20;
    transform: translateY(-50%);
  }

  /* 角の切り欠き */
  .notch {
    position: absolute;
    bottom: 0;
    width: 18px; height: 18px;
    background: #1a1228;
    border-radius: 0 10px 0 0;
  }
  .notch.left  { left: 0; }
  .notch.right { right: 0; border-radius: 10px 0 0 0; }

  /* ---- コントロール ---- */
  .controls {
    display: flex;
    gap: 20px;
    margin: 24px auto 0;
    justify-content: center;
  }

  .ctrl-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid #c89a50;
    background: transparent;
    color: #c89a50;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s, transform 0.1s;
  }
  .ctrl-btn:hover { background: #c89a50; color: #1a1228; }
  .ctrl-btn:active { transform: scale(0.93); }
  .ctrl-btn.playing { background: #c89a50; color: #1a1228; }

  /* ---- YouTube プレイヤー ---- */
  .player-wrap {
    width: min(640px, 100%);
    margin: 28px auto 0;
    display: none;
  }
  .player-wrap.visible { display: block; }
  .player-wrap iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 10px;
    display: block;
  }

  /* ---- プレイリスト入力欄 ---- */
  .playlist-form {
    margin-top: 28px;
    width: min(480px, 100%);
    background: #110e1a;
    border: 1px solid #3a2a1a;
    border-radius: 12px;
    padding: 20px;
  }
  .playlist-form label {
    display: block;
    font-size: 0.8rem;
    color: #9a8a70;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  .playlist-form input[type="text"] {
    flex: 1;
    padding: 9px 12px;
    border-radius: 6px;
    border: 1px solid #3a2a1a;
    background: #1e1828;
    color: #e0d8cc;
    font-size: 0.88rem;
    font-family: monospace;
    min-width: 0;
  }
  .playlist-form input[type="text"]:focus {
    outline: none;
    border-color: #c89a50;
  }
  .save-btn {
    padding: 9px 18px;
    background: #c89a50;
    color: #1a1228;
    border: none;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .save-btn:hover { opacity: 0.85; }

  .status-msg {
    font-size: 0.8rem;
    margin-top: 8px;
    min-height: 1.2em;
  }
  .status-msg.ok    { color: #80c870; }
  .status-msg.ready { color: #9a8a70; }
</style>
</head>
<body>

<header>
  <h1>民謡カセット</h1>
  <p>JAPANESE FOLK SONGS</p>
</header>

<div class="cassette">
  <div class="cassette-label">
    <div class="label-title">日本の民謡</div>
    <div class="label-sub">TAPE A</div>
  </div>
  <div class="reel-area">
    <div class="reel" id="reel-l"></div>
    <div class="tape-window">
      <div class="tape-line"></div>
    </div>
    <div class="reel" id="reel-r"></div>
  </div>
  <div class="notch left"></div>
  <div class="notch right"></div>
</div>

<div class="controls">
  <button class="ctrl-btn" id="play-btn" onclick="togglePlay()" title="再生 / 一時停止">&#9654;</button>
</div>

<div class="player-wrap" id="player-wrap">
  <iframe id="yt-frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

<div class="playlist-form">
  <label for="url-input">YouTube プレイリスト URL</label>
  <div class="input-row">
    <input type="text" id="url-input"
      placeholder="https://www.youtube.com/playlist?list=XXXXXXXX">
    <button class="save-btn" onclick="saveUrl()">保存する</button>
  </div>
  <div class="status-msg" id="status-msg"></div>
</div>

<script>
  const STORAGE_KEY = 'minyou_playlist_url';
  let playing = false;

  function getListId() {
    const raw = localStorage.getItem(STORAGE_KEY) || '';
    const m = raw.match(/[?&]list=([^&\s]+)/);
    return m ? m[1] : null;
  }

  function setStatus(text, cls) {
    const el = document.getElementById('status-msg');
    el.textContent = text;
    el.className = 'status-msg ' + cls;
  }

  function togglePlay() {
    const listId = getListId();
    const btn    = document.getElementById('play-btn');
    const wrap   = document.getElementById('player-wrap');
    const frame  = document.getElementById('yt-frame');
    const reelL  = document.getElementById('reel-l');
    const reelR  = document.getElementById('reel-r');

    if (!listId) {
      setStatus('まずプレイリスト URL を入力して「保存する」を押してください', 'ready');
      document.getElementById('url-input').focus();
      return;
    }

    if (!playing) {
      frame.src = 'https://www.youtube.com/embed/videoseries?list=' + listId + '&autoplay=1';
      wrap.classList.add('visible');
      btn.innerHTML = '&#9646;&#9646;';
      btn.classList.add('playing');
      reelL.classList.add('spinning');
      reelR.classList.add('spinning');
      playing = true;
    } else {
      frame.src = '';
      wrap.classList.remove('visible');
      btn.innerHTML = '&#9654;';
      btn.classList.remove('playing');
      reelL.classList.remove('spinning');
      reelR.classList.remove('spinning');
      playing = false;
    }
  }

  function saveUrl() {
    const val = document.getElementById('url-input').value.trim();
    if (!val) { setStatus('URL を入力してください', 'ready'); return; }
    if (!val.includes('list=')) { setStatus('プレイリストの URL を貼り付けてください', 'ready'); return; }
    localStorage.setItem(STORAGE_KEY, val);
    setStatus('保存しました。▶ で再生できます', 'ok');
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      document.getElementById('url-input').value = saved;
      setStatus('▶ ボタンを押すと再生されます', 'ready');
    }
  });
</script>
</body>
</html>
